<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, initial-scale=1" />
    <title>AgentFICO · Demo</title>
    <link rel="stylesheet" href="../assets/brand/theme.css" />
    <style>
      :root { --frame-w: 1920px; --frame-h: 1080px; }
      * { box-sizing: border-box; }
      html, body { width: var(--frame-w); height: var(--frame-h); overflow: hidden; margin: 0; }
      body {
        position: relative;
        display: grid;
        place-items: center;
        color: var(--ink);
        background: var(--bg);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
      }
      .field, .field::before, .field::after { position: absolute; inset: -12%; pointer-events: none; }
      .field {
        background:
          radial-gradient(ellipse at 18% 24%, #bfcbe0a6 0, #bfcbe054 18%, transparent 38%),
          radial-gradient(ellipse at 78% 72%, #cbd6e6a6 0, #cbd6e654 22%, transparent 43%),
          var(--bg);
        filter: blur(11px);
        animation: breathe 12s ease-in-out infinite alternate;
      }
      .field::before {
        inset: 12% 8% 5% 24%;
        content: "";
        opacity: .44;
        background: radial-gradient(ellipse at 50% 50%, #658ac35c 0, transparent 65%);
        filter: blur(80px);
        animation: drift 17s ease-in-out infinite alternate;
      }
      .field::after {
        inset: 22% 54% 16% -10%;
        content: "";
        opacity: .35;
        background: radial-gradient(ellipse at 50% 50%, #d2d9e8 0, transparent 68%);
        filter: blur(72px);
        animation: drift-reverse 19s ease-in-out infinite alternate;
      }
      .frame {
        position: relative;
        display: grid;
        width: 1440px;
        height: 820px;
        align-content: center;
        justify-items: center;
        padding: 58px 100px;
        text-align: center;
      }
      .frame::before, .frame::after {
        position: absolute;
        right: 0; left: 0;
        height: 1px;
        background: color-mix(in srgb, var(--line) 76%, transparent);
        content: "";
      }
      .frame::before { top: 0; }
      .frame::after { bottom: 0; }
      .meta {
        margin: 0 0 34px;
        color: var(--deep);
        font: 500 13px/1.4 var(--font-body);
        letter-spacing: .19em;
        text-transform: uppercase;
      }
      h1 {
        max-width: 1120px;
        margin: 0;
        color: var(--ink);
        font: 390 75px/1.05 var(--font-serif);
        letter-spacing: -.035em;
        text-wrap: balance;
      }
      html[data-mode="intro"] h1 { max-width: 1340px; font-size: 64px; }
      .sub {
        max-width: 920px;
        margin: 27px 0 0;
        color: var(--body);
        font: 400 25px/1.5 var(--font-serif);
        text-wrap: balance;
      }
      .seal {
        width: 148px;
        height: 148px;
        margin: 0 0 23px;
        color: var(--ink);
        opacity: .96;
      }
      #mark-slot svg { display: block; width: 100%; height: 100%; overflow: visible; }
      #mark-slot #mark > * {
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        animation: etch 5s cubic-bezier(.35,.15,.2,1) forwards;
      }
      #mark-slot .stipple { opacity: 0; animation: stipple-in 1.2s ease 2s forwards; }
      .wordmark {
        margin: 0 0 6px;
        font: 500 19px/1 var(--font-serif);
        letter-spacing: .01em;
      }
      .tagline {
        margin: 0 0 30px;
        color: var(--muted);
        font: 500 10px/1.2 var(--font-body);
        letter-spacing: .21em;
        text-transform: uppercase;
      }
      .foot {
        position: absolute;
        right: 0; bottom: 30px; left: 0;
        display: flex;
        justify-content: space-between;
        color: color-mix(in srgb, var(--body) 68%, transparent);
        font: 500 10px/1 var(--font-body);
        letter-spacing: .13em;
        text-transform: uppercase;
      }
      .why {
        width: 900px;
        margin: 31px 0 0;
        border-top: 1px solid var(--line);
        padding-top: 20px;
        color: var(--deep);
        font: 500 12px/1.4 var(--font-body);
        letter-spacing: .12em;
        text-transform: uppercase;
      }
      .diagram {
        display: grid;
        width: 1280px;
        grid-template-columns: 1fr 96px 1fr 96px 1fr;
        align-items: center;
        margin: 44px 0 0;
      }
      .node {
        display: grid;
        min-height: 170px;
        align-content: center;
        justify-items: center;
        gap: 11px;
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--surface) 72%, transparent);
        animation: node-in .7s ease both;
      }
      .node:nth-child(1) { animation-delay: .4s; }
      .node:nth-child(3) { animation-delay: 1.1s; }
      .node:nth-child(5) { animation-delay: 1.8s; }
      .node-label { color: var(--muted); font: 500 11px/1.2 var(--font-body); letter-spacing: .14em; text-transform: uppercase; }
      .node-title { color: var(--ink); font: 410 30px/1.15 var(--font-serif); }
      .node-note { color: var(--body); font: 400 14px/1.4 var(--font-body); }
      .connector { height: 1px; background: var(--line); position: relative; overflow: hidden; }
      .connector::after {
        position: absolute; top: -2px; left: -26px; width: 26px; height: 5px;
        content: ""; background: var(--mist); filter: blur(1px);
        animation: signal 2.3s ease-in-out infinite;
      }
      .serv-note { margin: 28px 0 0; color: var(--deep); font: 500 12px/1.5 var(--font-body); letter-spacing: .04em; }
      .repo { margin-top: 34px; color: var(--body); font: 500 18px/1.5 var(--font-data); }
      .small-line { margin: 13px 0 0; color: var(--body); font: 400 20px/1.4 var(--font-serif); }
      .fade-in { animation: fade-in .7s ease both; }
      @keyframes breathe { to { transform: scale(1.035) translate3d(-.4%, .3%, 0); } }
      @keyframes drift { to { transform: translate3d(3%, -2%, 0) scale(1.08); } }
      @keyframes drift-reverse { to { transform: translate3d(-3%, 2%, 0) scale(1.1); } }
      @keyframes etch { to { stroke-dashoffset: 0; } }
      @keyframes stipple-in { to { opacity: .7; } }
      @keyframes signal { 100% { transform: translateX(440px); } }
      @keyframes node-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes fade-in { from { opacity: 0; transform: translateY(9px); filter: blur(3px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }
      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    </style>
  </head>
  <body>
    <div class="field"></div>
    <main class="frame" id="frame"></main>
    <script type="module">
      const query = new URLSearchParams(location.search);
      const mode = query.get("mode") || "intro";
      const frame = document.getElementById("frame");
      const content = {
        intro: `
          <div class="seal fade-in" id="mark-slot" aria-hidden="true"></div>
          <p class="wordmark fade-in">AgentFICO</p>
          <p class="tagline fade-in">A public record of agent behavior</p>
          <h1 class="fade-in">Agents are about to spend your money. Which ones do you trust?</h1>
          <div class="foot"><span>AgentFICO · Reppo track</span><span>Open behavioral trust</span></div>`,
        problem: `
          <p class="meta fade-in">A new kind of worker. A new kind of risk.</p>
          <h1 class="fade-in">Claims are easy.<br>Evidence is harder.</h1>
          <p class="sub fade-in">Before an agent spends or accepts work, make its history legible.</p>
          <div class="why fade-in">A score is useful only when the evidence behind it is visible.</div>
          <div class="foot"><span>AgentFICO · Research note</span><span>Behavior before claims</span></div>`,
        architecture: `
          <p class="meta fade-in">One evidence path. A deterministic score.</p>
          <h1 class="fade-in" style="font-size:62px">A record you can follow.</h1>
          <div class="diagram" aria-label="Architecture diagram">
            <div class="node"><span class="node-label">Inputs</span><strong class="node-title">Observed events</strong><span class="node-note">Reppo · Kite · agent logs</span></div>
            <div class="connector"></div>
            <div class="node"><span class="node-label">Evidence store</span><strong class="node-title">Validated history</strong><span class="node-note">SQLite · cited records</span></div>
            <div class="connector"></div>
            <div class="node"><span class="node-label">Published model</span><strong class="node-title">Deterministic score</strong><span class="node-note">API · CLI · dashboard</span></div>
          </div>
          <p class="serv-note">SERV Reasoning explains and reviews. It never sets the score.</p>
          <div class="foot"><span>AgentFICO · afc-0.2</span><span>Inputs → evidence → score</span></div>`,
        why: `
          <p class="meta fade-in">A shared signal for people and agents.</p>
          <h1 class="fade-in">Trust, made legible.</h1>
          <p class="sub fade-in">Open evidence makes behavior easier to inspect, compare, and question.</p>
          <div class="why fade-in">Free to read · Open source · No credit decision</div>
          <div class="foot"><span>AgentFICO</span><span>Behavior · evidence · context</span></div>`,
        outro: `
          <div class="seal fade-in" id="mark-slot" aria-hidden="true"></div>
          <p class="wordmark fade-in">AgentFICO</p>
          <h1 class="fade-in" style="font-size:66px">Trust, made legible.</h1>
          <p class="repo fade-in">github.com/ozgureyilmaz/agentfico</p>
          <p class="small-line fade-in">Built on SERV Reasoning · Reppo track</p>
          <div class="foot"><span>Open · Free · MIT core</span><span>300–850 behavioral trust score</span></div>`,
      };
      frame.innerHTML = content[mode] || content.intro;
      document.documentElement.dataset.mode = mode;
    </script>
  </body>
</html>
