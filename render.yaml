services:
  - type: web
    name: agentfico
    runtime: docker
    plan: free
    region: frankfurt
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    envVars:
      - key: AFC_HOSTED
        value: "1"
      - key: AFC_OFFLINE
        value: "1"
      - key: AFC_EPHEMERAL_DB
        value: "1"
      - key: HOST
        value: 0.0.0.0
